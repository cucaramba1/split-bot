[project]
name = "split-bot"
version = "0.1.0"
description = "Telegram-бот: общие траты на троих и очереди байка и воды"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "python-dotenv>=1.2.3",
    "httpx",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
